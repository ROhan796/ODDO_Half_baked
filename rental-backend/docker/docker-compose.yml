version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rental-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rental-network
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: rental-worker
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rental-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rental-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - rental-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rental-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - rental-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  rental-network:
    driver: bridge
